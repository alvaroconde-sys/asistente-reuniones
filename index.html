<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de reuniones — prueba</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; color: #1a1a1a; background: #fff; }
  body.alarma { background: #c62828; }
  button, input, select { font: inherit; }
  button { padding: .6rem 1.4rem; border-radius: 8px; border: 1px solid #888; cursor: pointer; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; }
  .fila { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
  .fila input { flex: 1 1 12rem; min-width: 0; }
  .fila button { padding: 0 .8rem; }
  #empezar { background: #1b5e20; color: #fff; border: 0; }
  #puntos li { cursor: pointer; }
  #puntos li.activo { font-weight: bold; color: #1b5e20; }
  #texto { min-height: 6rem; padding: 1rem; background: #f3f3f3; border-radius: 8px; white-space: pre-wrap; }
  #aviso { margin: 1rem 0; padding: 1.5rem; border-radius: 12px; background: #fff3cd; border: 3px solid #e65100; font-size: 1.4rem; }
  #aviso button { background: #e65100; color: #fff; border: 0; margin: .5rem .5rem 0 0; }
  #eventos, #contadores, #resumen { color: #555; font-size: .9rem; }
  #estado.grave { color: #c62828; font-weight: bold; font-size: 1.3rem; }
</style>
</head>
<body>
<h1>Prueba del detector</h1>
<fieldset id="preparar">
  <legend>Orden del día</legend>
  <div id="filas"></div>
  <button id="anadir">Añadir punto</button>
  <p><label><input type="checkbox" id="modoPrueba"> Modo prueba: al terminar, descargar en este portátil el texto que vio la IA en cada aviso (solo con el consentimiento de los asistentes)</label></p>
</fieldset>
<p>
  <button id="empezar">Empezar reunión</button>
  <button id="erroneo" hidden>Este aviso es erróneo</button>
  <button id="noAviso" hidden>No ha avisado</button>
  <button id="terminar" hidden>Terminar</button>
  <span id="estado"></span>
</p>
<ol id="puntos" title="Pulsa un punto para corregir el punto activo"></ol>
<div id="aviso" hidden>
  <span id="mensaje"></span>. Aviso en <strong id="segundos"></strong> s<br>
  <button id="cancelar">Cancelar</button>
  <button id="irPunto"></button>
</div>
<div id="texto"></div>
<ul id="eventos"></ul>
<p id="contadores"></p>
<p id="resumen"></p>

<script type="module">
import { SonioxClient } from 'https://cdn.jsdelivr.net/npm/@soniox/client@2.4.0/dist/index.mjs';

const VENTANA_MS = 30_000; // 30 s de vueltas o fuera del punto antes de avisar (DECISIONES.md)
const CADA_MS = 10_000;    // cada cuánto se consulta al detector
const PREAVISO_S = 5;      // segundos que tiene el organizador para cancelar un aviso de la IA
const CINCO_MIN = 5 * 60_000;
const MARGEN_DIVAGAR = 60_000; // se permite divagar 1 minuto seguido (DECISIONES.md, 26-oct)
const TIPOS = { 'Small decisions': 15, 'Big decisions': 30, 'Save the world': 60 }; // minutos por punto
const FRASES = {
  'cinco minutos': 'Quedan 5 minutos para finalizar el tiempo de este punto del orden del día, por favor, vayan sacando conclusiones para cerrarlo',
  'fin de tiempo': 'Se ha acabado el tiempo para este punto, por favor, pasen al siguiente',
  'vueltas': 'Están dando vueltas, por favor, cambien el enfoque para poder seguir avanzando',
  'fuera del orden del día': 'Se está divagando, por favor, céntrense en el punto del orden del día',
  'otro punto': 'Han cambiado de punto sin cerrar el actual, por favor, ciérrenlo antes de seguir',
};

const $ = (id) => document.getElementById(id);
const li = (texto, props) => Object.assign(document.createElement('li'), { textContent: texto, ...props });
let grabacion, consultas, reloj, preaviso, evento, inicio, desde, inicioPunto, vueltaPendiente = null, divagarDesde = null, ocupado = false, callado = false;
let frases = [], puntos = [], activo = 0, eventos = [], previsto = 0;
const cuenta = { consultas: 0, errores: 0, tokensEntrada: 0, tokensSalida: 0 };

const texto = (filtro) => frases.filter(filtro).map((f) => f.texto).join('');
const actual = () => puntos[activo - 1];
// Tiempo que le queda a un punto; negativo si se ha pasado.
const restante = (p) => p.presupuesto - p.usado - (p === actual() ? Date.now() - inicioPunto : 0);
const mmss = (ms) => { const s = Math.floor(Math.abs(ms) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function pintar() {
  $('puntos').replaceChildren(...puntos.map((p, i) => {
    const r = restante(p);
    const tiempo = r >= 0 ? `quedan ${mmss(r)}` : `${mmss(r)} de más`;
    return li(`${p.nombre} · ${p.tipo} · ${tiempo}`, { className: i + 1 === activo ? 'activo' : '', onclick: () => i + 1 !== activo && activar(i + 1) });
  }));
  $('eventos').replaceChildren(...eventos.map((e) => li(`${e.hora} · ${e.tipo}${e.tema ? `: ${e.tema}` : ''}${e.resultado ? ` → ${e.resultado}` : ''}${e.erroneo ? ' · erróneo' : ''}`)));
  $('contadores').textContent = Object.entries(cuenta).map(([k, v]) => `${k}: ${v}`).join(' · ');
}

// Registro en pantalla de avisos y cambios de punto, para revisar después cuáles eran falsos. No se guarda.
function registrar(tipo, tema = '', resultado = '') {
  const e = { hora: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }), tipo, tema, resultado };
  eventos.push(e);
  pintar();
  return e;
}

// El punto empieza al inicio de la ventana en la que se detectó el cambio, para no perder sus primeras frases.
// Al cerrar un punto, lo que le sobra (o lo que se ha pasado, en negativo) pasa al punto siguiente.
// Lo hablado antes del punto activo no se manda al detector: las vueltas se miden dentro del punto.
function activar(n, comienzo = Date.now() - VENTANA_MS, cerrado = false) {
  const anterior = actual();
  comienzo = Math.max(comienzo, inicioPunto);
  if (anterior) anterior.usado += comienzo - inicioPunto;
  activo = n;
  inicioPunto = comienzo;
  vueltaPendiente = divagarDesde = null;
  const nuevo = actual();
  if (anterior && cerrado) {
    const r = restante(anterior);
    anterior.presupuesto -= r;
    nuevo.presupuesto += r;
  }
  if (restante(nuevo) <= CINCO_MIN) nuevo.aviso5 = true; // si ya quedan menos de 5 minutos, ese aviso no se da
  pintar();
}

function anadirFila() {
  const fila = Object.assign(document.createElement('div'), { className: 'fila' });
  fila.innerHTML = `<input placeholder="Punto del orden del día"><select>${Object.entries(TIPOS).map(([t, m]) => `<option value="${t}">${t} · ${m} min</option>`).join('')}</select><button title="Quitar punto">✕</button>`;
  fila.querySelector('button').onclick = () => fila.remove();
  $('filas').append(fila);
}
$('anadir').onclick = anadirFila;
for (let i = 0; i < 3; i++) anadirFila();

$('empezar').onclick = () => {
  puntos = [...document.querySelectorAll('.fila')]
    .map((f) => ({ nombre: f.querySelector('input').value.trim(), tipo: f.querySelector('select').value }))
    .filter((p) => p.nombre)
    .map((p) => ({ ...p, presupuesto: TIPOS[p.tipo] * 60_000, usado: 0, aviso5: false, finDicho: 0 }));
  if (!puntos.length) return ($('estado').textContent = 'Escribe el orden del día');
  previsto = puntos.reduce((s, p) => s + TIPOS[p.tipo], 0);
  speechSynthesis.getVoices(); // las voces cargan en segundo plano: así están listas para el primer aviso
  navigator.wakeLock?.request('screen').catch(() => {});
  const cliente = new SonioxClient({ config: async () => (await fetch('/api/soniox-key', { method: 'POST' })).json() });
  // 6 reintentos: 1+2+4+8+16+32 = 63 s de margen ante un corte de red (el SDK trae 3, ~7 s).
  grabacion = cliente.realtime.record({ model: 'stt-rt-v5', language_hints: ['es'], auto_reconnect: true, max_reconnect_attempts: 6 });
  grabacion.on('result', ({ tokens }) => {
    const final = tokens.filter((t) => t.is_final).map((t) => t.text).join('');
    if (final) frases.push({ t: Date.now(), texto: final });
    $('texto').textContent = (texto(() => true) + tokens.filter((t) => !t.is_final).map((t) => t.text).join('')).slice(-400);
  });
  // «error» solo llega cuando el SDK se rinde: sin transcripción no hay avisos de la IA, y tiene que verse.
  grabacion.on('state_change', ({ new_state }) => {
    $('estado').textContent = new_state === 'error' ? 'Se ha perdido la transcripción: pulsa «Terminar» y vuelve a empezar' : new_state;
    $('estado').className = new_state === 'error' ? 'grave' : '';
  });
  grabacion.on('error', (e) => ($('estado').textContent = `Error: ${e.message}`));
  eventos = [];
  activo = 0;
  for (const k in cuenta) cuenta[k] = 0;
  inicio = desde = inicioPunto = Date.now();
  vueltaPendiente = divagarDesde = null;
  consultas = setInterval(comprobar, CADA_MS);
  reloj = setInterval(cadaSegundo, 1000);
  for (const id of ['preparar', 'empezar']) $(id).hidden = true;
  for (const id of ['erroneo', 'noAviso', 'terminar']) $(id).hidden = false;
  $('resumen').textContent = '';
  pintar();
};

// Lo que se manda al detector: orden del día, punto activo, lo hablado antes en el punto y el último tramo.
const ventana = (corte) => ({ orden: puntos.map((p) => p.nombre), activo, antes: texto((f) => f.t >= inicioPunto && f.t < corte), ultimo: texto((f) => f.t >= corte) });

// Vueltas solo se avisa si la detectan dos consultas cuyas ventanas no se solapan: la segunda entre 30 y 50 s
// después de la primera (DECISIONES.md, 26-oct). Así hacen falta ~60 s de vueltas.
function vueltasConfirmadas(corte) {
  const desdePrimera = corte - vueltaPendiente;
  if (vueltaPendiente !== null && desdePrimera >= VENTANA_MS && desdePrimera <= VENTANA_MS + 2 * CADA_MS) return true;
  if (vueltaPendiente === null || desdePrimera > VENTANA_MS + 2 * CADA_MS) vueltaPendiente = corte;
  return false;
}

// Divagar se permite hasta 1 minuto seguido. Se cuenta desde la mitad de la primera ventana en la que se detecta
// (la divagación ya ocupa la mayor parte de esa ventana) y se reinicia en cuanto vuelven al orden del día.
function seguirDivagando(accion, corte) {
  if (accion !== 'fuera del orden del día') {
    divagarDesde = null;
    return false;
  }
  divagarDesde ??= corte + VENTANA_MS / 2;
  return corte + VENTANA_MS - divagarDesde >= MARGEN_DIVAGAR;
}

// Solo se consulta con una ventana completa desde el inicio o desde el último aviso de la IA.
async function comprobar() {
  const corte = Date.now() - VENTANA_MS;
  if (ocupado || preaviso || callado || corte < desde) return;
  const cuerpo = ventana(corte);
  if (!cuerpo.ultimo.trim()) return;
  const g = grabacion;
  ocupado = true;
  try {
    const r = await (await fetch('/api/analizar', { method: 'POST', body: JSON.stringify(cuerpo) })).json();
    if (grabacion !== g) return; // la reunión terminó mientras se esperaba la respuesta
    cuenta.consultas++;
    cuenta.tokensEntrada += r.uso.input_tokens;
    cuenta.tokensSalida += r.uso.output_tokens;
    if (activo !== cuerpo.activo) return; // el organizador cambió de punto mientras se esperaba: respuesta caducada
    const divagarToca = seguirDivagando(r.accion, corte);
    if (r.accion === 'nada') return;
    if (r.accion === 'cambio de punto') {
      activar(r.punto, corte, true);
      registrar(r.accion, r.tema, 'automático');
    } else if (r.accion === 'vueltas' ? vueltasConfirmadas(corte) : r.accion === 'otro punto' || divagarToca) {
      avisar(r.accion, r.tema, r.accion === 'otro punto' ? r.punto : 0);
      if ($('modoPrueba').checked) Object.assign(evento, { entrada: cuerpo, respuesta: { accion: r.accion, punto: r.punto, tema: r.tema } });
    }
  } catch {
    cuenta.errores++;
  } finally {
    ocupado = false;
    pintar();
  }
}

// Avisos por tiempo: exactos, sin preaviso. «Fin de tiempo» se repite cada 5 minutos mientras sigan en el punto.
function cadaSegundo() {
  if (callado && !speechSynthesis.speaking) {
    callado = false;
    grabacion?.resume();
  }
  const p = actual();
  if (p) {
    const r = restante(p);
    if (!p.aviso5 && r > 0 && r <= CINCO_MIN) {
      p.aviso5 = true;
      registrar('cinco minutos', p.nombre, 'sonó');
      decir('cinco minutos');
    }
    if (r <= 0 && Date.now() - p.finDicho >= CINCO_MIN) {
      p.finDicho = Date.now();
      registrar('fin de tiempo', p.nombre, 'sonó');
      decir('fin de tiempo');
    }
  }
  pintar();
}

// Avisos de la IA: preaviso cancelable de 5 s y, si nadie cancela, voz.
function avisar(tipo, tema, punto) {
  vueltaPendiente = divagarDesde = null;
  evento = registrar(tipo, tema, 'preaviso');
  $('mensaje').textContent = {
    'vueltas': `Estáis dando vueltas a ${tema || 'lo mismo'}`,
    'otro punto': `Os habéis ido al punto ${punto} (${tema}) sin cerrar el punto ${activo}`,
    'fuera del orden del día': `Os habéis salido del orden del día: ${tema || 'otro asunto'}`,
  }[tipo];
  $('irPunto').hidden = !punto;
  $('irPunto').textContent = `Ir al punto ${punto}`;
  $('irPunto').onclick = () => { cerrarAviso('ir al punto'); activar(punto); };
  let s = PREAVISO_S;
  const tic = () => { $('segundos').textContent = s; if (s-- === 0) cerrarAviso('sonó'); };
  $('aviso').hidden = false;
  tic();
  preaviso = setInterval(tic, 1000);
}

function cerrarAviso(resultado) {
  clearInterval(preaviso);
  preaviso = null;
  $('aviso').hidden = true;
  desde = Date.now();
  evento.resultado = resultado;
  if (resultado === 'sonó') decir(evento.tipo);
  pintar();
}
$('cancelar').onclick = () => cerrarAviso('cancelado');
$('noAviso').onclick = () => {
  const e = registrar('no ha avisado');
  if ($('modoPrueba').checked) e.entrada = ventana(Date.now() - VENTANA_MS);
};
// Marca como erróneo el último aviso de la IA; si aún está en preaviso, además lo cancela.
$('erroneo').onclick = () => {
  if (!evento || evento.erroneo) return;
  evento.erroneo = true;
  if (preaviso) cerrarAviso('cancelado');
  else pintar();
};

// Aviso a la sala: pantalla roja y voz. Mientras habla, la app deja de escuchar para no transcribirse
// a sí misma («pasen al siguiente» cerraría el punto). Vuelve a escuchar cuando termina (cadaSegundo).
function decir(tipo) {
  document.body.classList.add('alarma');
  setTimeout(() => document.body.classList.remove('alarma'), 3000);
  const voz = Object.assign(new SpeechSynthesisUtterance(FRASES[tipo]), { lang: 'es-ES' });
  voz.voice = speechSynthesis.getVoices().find((v) => v.lang === 'es-ES') ?? null;
  callado = true;
  grabacion?.pause();
  speechSynthesis.speak(voz);
}

// Al terminar se borra la transcripción; quedan en pantalla el registro de avisos y los contadores.
$('terminar').onclick = async () => {
  clearInterval(consultas);
  clearInterval(reloj);
  if (preaviso) cerrarAviso('reunión terminada');
  speechSynthesis.cancel();
  const g = grabacion;
  grabacion = null;
  await g.stop().catch(() => {}); // pase lo que pase al parar, hay que borrar la transcripción
  frases = [];
  if ($('modoPrueba').checked) descargar({ fecha: new Date().toISOString(), orden: puntos.map(({ nombre, tipo }) => ({ nombre, tipo })), eventos });
  puntos = [];
  for (const id of ['texto', 'estado']) $(id).textContent = '';
  $('resumen').textContent = `Reunión terminada. Previsto: ${previsto} min · Real: ${((Date.now() - inicio) / 60000).toFixed(1)} min. Transcripción borrada.`;
  for (const id of ['erroneo', 'noAviso', 'terminar']) $(id).hidden = true;
  for (const id of ['preparar', 'empezar']) $(id).hidden = false;
  pintar();
};

// Modo prueba: el fichero queda solo en el portátil; en la página se borran los textos tras descargarlo.
function descargar(datos) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' }));
  a.download = `prueba-reunion-${datos.fecha.slice(0, 16).replace(':', '')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); // libera la copia en memoria cuando la descarga ya ha empezado
  for (const e of eventos) { delete e.entrada; delete e.respuesta; }
}
</script>
</body>
</html>
